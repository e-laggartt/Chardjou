<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Чарджоу, школа №20</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { overflow-x: hidden; overflow-y: auto; }

body {
  font-family: Georgia, 'Times New Roman', serif;
  background: #cabfa5;
  color: #3d2f1e;
  padding: 12px;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 9999;
  opacity: 0.16;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(0,0,0,0.5) 0.5px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(0,0,0,0.4) 0.5px, transparent 1px),
    radial-gradient(circle at 40% 80%, rgba(0,0,0,0.5) 0.5px, transparent 1px),
    radial-gradient(circle at 85% 15%, rgba(0,0,0,0.4) 0.5px, transparent 1px);
  background-size: 3px 3px, 5px 5px, 4px 4px, 6px 6px;
  mix-blend-mode: multiply;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 9998;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(60,40,20,0.3) 100%);
}

.container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }

header { text-align: center; margin-bottom: 16px; }
header h1 {
  font-family: 'Caveat', Georgia, serif;
  font-weight: 700;
  font-size: 44px;
  color: #4a3520;
  margin-bottom: 0;
  letter-spacing: 1px;
  line-height: 1;
  text-shadow: 0 1px 0 rgba(255,255,255,0.35), 0 -1px 0 rgba(0,0,0,0.15);
}
header p {
  font-family: Georgia, serif;
  font-size: 14px;
  color: #6b5438;
  font-style: italic;
  margin-top: 4px;
}

.seats-counter {
  text-align: center;
  font-size: 14px;
  color: #5a4a30;
  margin: 6px 0 0;
  font-style: italic;
}
.seats-counter b { color: #4a6b3a; font-style: normal; }

/* Строка поиска */
.search-bar {
  display: flex;
  justify-content: center;
  margin: 12px auto 0;
  max-width: 360px;
}
.search-bar input {
  width: 100%;
  padding: 10px 14px;
  font-family: Georgia, serif;
  font-size: 15px;
  border: 2px solid #a89468;
  border-radius: 4px;
  background: #faf3dd;
  color: #3d2f1e;
  outline: none;
}
.search-bar input:focus { border-color: #6a5a3a; }
.search-bar input::placeholder { color: #a89878; font-style: italic; }

/* Общая строка с периодами и кнопкой списка */
.controls-row {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 8px;
  margin: 16px 0;
  flex-wrap: wrap;
}
.periods {
  display: flex;
  justify-content: center;
  gap: 6px;
  flex: 1;
  min-width: 260px;
  max-width: 500px;
}
.period-btn {
  padding: 10px 20px;
  font-size: 15px;
  font-family: Georgia, serif;
  background: #d9cfb8;
  border: 2px solid #8b7548;
  border-radius: 4px;
  color: #4a3520;
  cursor: pointer;
  transition: 0.2s;
  flex: 1;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.15);
}
.period-btn:hover { background: #c9bda0; }
.period-btn.active {
  background: #4a6b3a;
  color: #efe6cf;
  border-color: #2d4520;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
}
.list-btn {
  padding: 10px 18px;
  font-family: Georgia, serif;
  font-size: 14px;
  background: #d9cfb8;
  border: 2px solid #8b7548;
  border-radius: 4px;
  color: #4a3520;
  cursor: pointer;
  transition: 0.2s;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.15);
}
.list-btn:hover { background: #c9bda0; }

.classroom-wrap {
  background: #d9cfb8;
  border: 3px solid #8b7548;
  border-radius: 6px;
  padding: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2), inset 0 0 40px rgba(139,117,72,0.2);
  overflow: hidden;
}
.classroom-scale { width: 100%; overflow: hidden; position: relative; }

.classroom {
  position: relative;
  width: 1040px;
  min-width: 1040px;
  margin: 0 auto;
  background: #e8ddc0;
  background-image: linear-gradient(180deg, #e8ddc0 0%, #ddd0b0 100%);
  border-radius: 4px;
  padding: 20px 20px 25px 20px;
  box-shadow: inset 0 0 60px rgba(139,117,72,0.25);
  transform-origin: top left;
  transition: transform 0.2s;
}

.wall-top, .wall-left, .wall-right {
  position: absolute;
  background: linear-gradient(180deg, #c9b88a, #a89468);
}
.wall-top { top: 0; left: 0; right: 0; height: 12px; border-radius: 4px 4px 0 0; }
.wall-left { top: 0; bottom: 0; left: 0; width: 12px; }
.wall-right { top: 0; bottom: 0; right: 0; width: 12px; }

.window-full {
  position: absolute;
  left: 18px;
  top: 60px;
  bottom: 40px;
  width: 15px;
  background: #6b4a25;
  border: 2px solid #4a3018;
  border-radius: 2px;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.4), 0 3px 8px rgba(0,0,0,0.3);
  overflow: hidden;
}
.window-full::before {
  content: '';
  position: absolute;
  inset: 2px;
  background: linear-gradient(180deg, #d8e8f0 0%, #a0c0dc 40%, #88b0cc 100%);
  box-shadow: inset 0 0 12px rgba(255,255,255,0.4);
}
.window-full::after {
  content: '';
  position: absolute;
  inset: 2px;
  background-image:
    linear-gradient(180deg,
      transparent 0, transparent 12%, #6b4a25 12%, #6b4a25 14%, transparent 14%,
      transparent 28%, #6b4a25 28%, #6b4a25 30%, transparent 30%,
      transparent 44%, #6b4a25 44%, #6b4a25 46%, transparent 46%,
      transparent 60%, #6b4a25 60%, #6b4a25 62%, transparent 62%,
      transparent 76%, #6b4a25 76%, #6b4a25 78%, transparent 78%,
      transparent 92%, #6b4a25 92%, #6b4a25 94%, transparent 94%, transparent 100%);
  pointer-events: none;
}

.flower-station {
  position: absolute;
  width: 40px;
  height: 40px;
  z-index: 6;
  cursor: grab;
  touch-action: none;
  user-select: none;
  transition: filter 0.15s;
}
.flower-station:hover { filter: brightness(1.05); }
.flower-station.dragging {
  cursor: grabbing;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4));
  z-index: 100;
  transition: none;
}
.flower-station[data-pot="0"] { top: 210px; left: 38px; }
.flower-station[data-pot="1"] { top: 420px; left: 38px; }
.flower-station[data-pot="2"] { top: 650px; left: 38px; }

.flower-station .pot {
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 26px; height: 20px;
  background: linear-gradient(180deg, #c06040 0%, #8a3a20 100%);
  border: 1.5px solid #5e2510;
  border-radius: 2px 2px 6px 6px;
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.25), inset 0 -2px 4px rgba(0,0,0,0.3), 0 3px 5px rgba(0,0,0,0.3);
  pointer-events: none;
}
.flower-station .pot::before {
  content: '';
  position: absolute;
  top: -4px; left: -2px; right: -2px;
  height: 6px;
  background: #a04028;
  border: 1.5px solid #5e2510;
  border-radius: 2px;
}
.flower-station .stem {
  position: absolute;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  width: 2px; height: 14px;
  background: #4a6b3a;
  pointer-events: none;
}
.flower-station .leaf {
  position: absolute;
  width: 9px; height: 5px;
  background: #5e8a4a;
  border-radius: 50% 0 50% 0;
  pointer-events: none;
}
.flower-station .leaf.l1 { bottom: 22px; left: 12px; transform: rotate(-25deg); }
.flower-station .leaf.l2 { bottom: 24px; left: 20px; transform: rotate(25deg) scaleX(-1); }

.flower-station .chamomile {
  position: absolute;
  bottom: 32px; left: 50%;
  transform: translateX(-50%);
  width: 16px; height: 16px;
  pointer-events: none;
}
.flower-station .chamomile .center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 5px; height: 5px;
  background: #e8c040;
  border-radius: 50%;
  box-shadow: 0 0 2px rgba(0,0,0,0.3);
  z-index: 2;
}
.flower-station .chamomile .petal {
  position: absolute;
  top: 50%; left: 50%;
  width: 4px; height: 7px;
  background: #f8f4e8;
  border-radius: 50%;
  transform-origin: 50% 100%;
  box-shadow: 0 0 1px rgba(0,0,0,0.2);
}
.flower-station .chamomile .petal:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
.flower-station .chamomile .petal:nth-child(2) { transform: translate(-50%, -100%) rotate(45deg); }
.flower-station .chamomile .petal:nth-child(3) { transform: translate(-50%, -100%) rotate(90deg); }
.flower-station .chamomile .petal:nth-child(4) { transform: translate(-50%, -100%) rotate(135deg); }
.flower-station .chamomile .petal:nth-child(5) { transform: translate(-50%, -100%) rotate(180deg); }
.flower-station .chamomile .petal:nth-child(6) { transform: translate(-50%, -100%) rotate(225deg); }
.flower-station .chamomile .petal:nth-child(7) { transform: translate(-50%, -100%) rotate(270deg); }
.flower-station .chamomile .petal:nth-child(8) { transform: translate(-50%, -100%) rotate(315deg); }

.blackboard {
  background: #3a4a35;
  background-image:
    radial-gradient(ellipse at 25% 35%, rgba(255,255,255,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 65%, rgba(0,0,0,0.2) 0%, transparent 60%);
  border: 8px solid #7a5e34;
  border-radius: 3px;
  height: 110px;
  margin: 30px 40px 0 40px;
  box-shadow: inset 0 0 50px rgba(0,0,0,0.55), 0 4px 8px rgba(0,0,0,0.25);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: rgba(240,235,220,0.85);
  position: relative;
  text-align: center;
  line-height: 1.4;
}
.blackboard .line1 {
  font-family: 'Caveat', 'Courier New', cursive;
  font-weight: 700;
  font-size: 36px;
  letter-spacing: 2px;
  text-shadow: 0 0 8px rgba(255,255,255,0.08);
}
.blackboard::after {
  content: '';
  position: absolute;
  bottom: 8px; right: 20px;
  width: 26px; height: 5px;
  background: #e8ddc0;
  border-radius: 2px;
  box-shadow: 14px 0 0 #e8ddc0, 28px 0 0 #e8ddc0;
  opacity: 0.7;
}
.blackboard::before {
  content: '';
  position: absolute;
  bottom: 6px; left: 20px;
  width: 30px; height: 14px;
  background: linear-gradient(180deg, #c8b898 0%, #a89878 100%);
  border-radius: 3px 3px 4px 4px;
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.4),
    inset 0 -2px 4px rgba(0,0,0,0.25),
    0 1px 2px rgba(0,0,0,0.3);
  opacity: 0.85;
  transform: rotate(-2deg);
}

.teacher-desk {
  width: 200px;
  height: 72px;
  margin: 22px auto 30px;
  background: linear-gradient(180deg, #b8935f 0%, #8b6238 100%);
  border: 2px solid #5e3f1e;
  border-radius: 3px;
  box-shadow: 0 6px 12px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.9);
  font-size: 12px;
  text-align: center;
  padding: 6px;
  letter-spacing: 1px;
  position: relative;
}
.teacher-desk::after {
  content: '';
  position: absolute;
  top: 8px; left: 14px;
  width: 26px; height: 18px;
  background: rgba(240,235,220,0.9);
  border-radius: 1px;
  box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
  transform: rotate(-4deg);
}

.seats-grid {
  display: flex;
  gap: 24px;
  justify-content: center;
  margin-top: 14px;
  padding: 0 90px 0 110px;
}
.seat-row {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.desk-pair {
  position: relative;
  display: flex;
  gap: 4px;
  background: #8b6238;
  border: 2px solid #5e3f1e;
  border-radius: 3px;
  padding: 4px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
}

.seat {
  width: 94px;
  height: 76px;
  background: linear-gradient(180deg, #efe6cf 0%, #ddd0b0 100%);
  border: 1px solid #8b7548;
  border-radius: 3px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, background 0.2s, opacity 0.25s;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
  padding: 4px;
  font-size: 12px;
  color: #3d2f1e;
  text-align: center;
}
.seat::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 6px;
  right: 6px;
  height: 8px;
  background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 100%);
  border-radius: 3px 3px 0 0;
  pointer-events: none;
}
.seat::before {
  content: '';
  position: absolute;
  bottom: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 52px;
  height: 10px;
  background: linear-gradient(180deg, #a88868, #7a5a38);
  border: 1px solid #5e3f1e;
  border-radius: 0 0 3px 3px;
  box-shadow: 0 2px 3px rgba(0,0,0,0.25);
  z-index: 2;
}
.seat:hover {
  background: linear-gradient(180deg, #faf3dd 0%, #e8ddc0 100%);
  box-shadow: inset 0 0 12px rgba(74,107,58,0.35), 0 4px 10px rgba(0,0,0,0.25);
  transform: translateY(-2px);
}
.seat.taken {
  background: linear-gradient(180deg, #d8dfc5 0%, #c0cba8 100%);
  border-color: #5e7a4a;
}
.seat.taken:hover {
  background: linear-gradient(180deg, #e4ebd2 0%, #ccd7b5 100%);
}

/* Подсветка при поиске */
.seat.dimmed { opacity: 0.25; }
.seat.highlighted {
  background: linear-gradient(180deg, #fceea0 0%, #f4dd70 100%) !important;
  border-color: #b89840 !important;
  box-shadow: 0 0 0 3px #e8c840, 0 0 20px rgba(232,200,64,0.7) !important;
  z-index: 10;
}

.seat-name {
  font-family: 'PT Serif', Georgia, serif;
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
  width: 100%;
  overflow: hidden;
  animation: nameFadeIn 0.4s ease-out;
}
@keyframes nameFadeIn {
  from { opacity: 0; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}

.seat .free { font-size: 13px; color: #a89468; font-style: italic; letter-spacing: 0.5px; }
.seat .plus {
  font-size: 26px;
  color: #b89868;
  line-height: 1;
  margin-bottom: 1px;
  animation: plusPulse 2.4s ease-in-out infinite;
}
@keyframes plusPulse {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}

/* ====== TOOLTIP ====== */
.tooltip {
  position: fixed;
  background: #2a1e10;
  color: #f0e4c8;
  padding: 10px 14px;
  border-radius: 6px;
  font-family: Georgia, serif;
  font-size: 14px;
  max-width: 260px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  pointer-events: none;
  z-index: 15000;
  opacity: 0;
  transition: opacity 0.15s;
  line-height: 1.35;
}
.tooltip.show { opacity: 1; }
.tooltip .tt-name {
  font-weight: bold;
  color: #fff;
  font-size: 15px;
  margin-bottom: 2px;
}
.tooltip .tt-comment {
  color: #d0c0a0;
  font-style: italic;
  font-size: 13px;
}

/* ====== МОДАЛКИ ====== */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(40,25,10,0.7);
  z-index: 10000;
  align-items: center; justify-content: center;
  padding: 12px;
  overflow-y: auto;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #efe6cf;
  border: 3px solid #8b7548;
  border-radius: 6px;
  padding: 22px;
  max-width: 480px;
  width: 100%;
  box-shadow: 0 14px 40px rgba(0,0,0,0.5);
  max-height: 92vh;
  overflow-y: auto;
}
.modal h2 {
  font-family: 'Caveat', Georgia, serif;
  font-weight: 700;
  color: #3a4a35;
  font-size: 30px;
  margin-bottom: 2px;
  line-height: 1;
}
.modal-sub { color: #6b5438; font-size: 13px; font-style: italic; margin-bottom: 14px; }
.modal label { display: block; font-size: 14px; font-weight: bold; color: #4a3520; margin: 12px 0 4px; }
.modal input[type="text"], .modal textarea {
  width: 100%;
  padding: 12px;
  font-family: Georgia, serif;
  font-size: 16px;
  border: 2px solid #a89468;
  border-radius: 4px;
  background: #faf3dd;
  color: #3d2f1e;
}
.modal textarea { resize: vertical; min-height: 60px; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap; }
.btn-cancel, .btn-save {
  padding: 14px 22px;
  font-family: Georgia, serif;
  font-size: 16px;
  border-radius: 4px;
  cursor: pointer;
  transition: 0.2s;
  flex: 1;
  min-width: 100px;
}
.btn-cancel { background: #ddd0b0; border: 2px solid #8b7548; color: #4a3520; }
.btn-cancel:hover { background: #c9bda0; }
.btn-save { background: #4a6b3a; border: 2px solid #2d4520; color: #efe6cf; }
.btn-save:hover { background: #3a5a2a; }
.btn-save:disabled { opacity: 0.6; cursor: wait; }
.btn-delete {
  background: #8b3a2a;
  border: 2px solid #5e1e10;
  color: #efe6cf;
  padding: 14px 22px;
  font-family: Georgia, serif;
  font-size: 16px;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  margin-bottom: 8px;
}
.btn-delete:hover { background: #732a1c; }
.modal-error {
  color: #8b3a2a;
  font-size: 14px;
  margin-top: 10px;
  min-height: 18px;
  text-align: center;
}

/* Список одноклассников */
.list-modal .modal-sub { margin-bottom: 12px; }
.list-content {
  max-height: 60vh;
  overflow-y: auto;
  margin-top: 8px;
}
.list-item {
  padding: 10px 12px;
  border-bottom: 1px solid #d8c8a8;
  cursor: pointer;
  transition: background 0.15s;
  border-radius: 4px;
}
.list-item:hover { background: #e8dcc0; }
.list-item:last-child { border-bottom: none; }
.list-item .li-name {
  font-family: 'PT Serif', Georgia, serif;
  font-weight: 700;
  color: #3d2f1e;
  font-size: 15px;
}
.list-item .li-place {
  font-size: 13px;
  color: #7a6a4a;
  font-style: italic;
  margin-top: 2px;
}
.list-item .li-comment {
  font-size: 13px;
  color: #5a4a30;
  margin-top: 3px;
}
.list-empty {
  text-align: center;
  padding: 30px 10px;
  color: #8a7a5a;
  font-style: italic;
}

.toast {
  position: fixed;
  left: 50%; bottom: 20px;
  transform: translateX(-50%) translateY(100px);
  background: #8b3a2a;
  color: #f0e4c8;
  padding: 14px 22px;
  border-radius: 6px;
  font-family: Georgia, serif;
  font-size: 15px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  z-index: 20000;
  transition: transform 0.3s ease-out;
  max-width: 90vw;
  text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }

.row-switcher {
  display: none;
  justify-content: center;
  gap: 6px;
  margin: 12px 0 8px;
  flex-wrap: wrap;
}
.row-btn {
  padding: 12px 16px;
  font-family: Georgia, serif;
  font-size: 15px;
  font-weight: bold;
  background: #d9cfb8;
  border: 2px solid #8b7548;
  border-radius: 4px;
  color: #4a3520;
  cursor: pointer;
  flex: 1;
  min-width: 90px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
}
.row-btn.active {
  background: #5e7a4a;
  color: #efe6cf;
  border-color: #3a4a35;
}

.mobile-classroom { display: none; }

@media (max-width: 700px) {
  body { padding: 8px; overflow-y: auto; }
  header h1 { font-size: 36px; }
  header p { font-size: 12px; }
  .seats-counter { font-size: 13px; }
  .search-bar { max-width: 100%; margin-top: 10px; }
  .period-btn { padding: 10px 12px; font-size: 14px; }
  .list-btn { padding: 10px 12px; font-size: 13px; }
  .row-switcher { display: flex; }
  .classroom-scale { display: none; }
  .classroom-wrap {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    overflow: visible;
    height: auto;
  }
  .mobile-classroom { display: block; }

  .mobile-blackboard {
    background: #3a4a35;
    background-image:
      radial-gradient(ellipse at 30% 40%, rgba(255,255,255,0.06) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 70%, rgba(0,0,0,0.2) 0%, transparent 60%);
    border: 6px solid #7a5e34;
    border-radius: 3px;
    padding: 18px 8px;
    margin: 0 0 14px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 3px 6px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(240,235,220,0.85);
    text-align: center;
    position: relative;
  }
  .mobile-blackboard .line1 {
    font-family: 'Caveat', 'Courier New', cursive;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 1px;
  }
  .mobile-blackboard::after {
    content: '';
    position: absolute;
    bottom: 4px; right: 10px;
    width: 18px; height: 3px;
    background: #e8ddc0;
    border-radius: 1px;
    box-shadow: 10px 0 0 #e8ddc0;
    opacity: 0.7;
  }
  .mobile-blackboard::before {
    content: '';
    position: absolute;
    bottom: 3px; left: 10px;
    width: 22px; height: 10px;
    background: linear-gradient(180deg, #c8b898 0%, #a89878 100%);
    border-radius: 2px;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.4), inset 0 -1px 2px rgba(0,0,0,0.25);
    opacity: 0.85;
  }

  .mobile-teacher-desk {
    width: 160px;
    height: 58px;
    margin: 0 auto 20px;
    background: linear-gradient(180deg, #b8935f 0%, #8b6238 100%);
    border: 2px solid #5e3f1e;
    border-radius: 3px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.9);
    font-size: 12px;
    letter-spacing: 1px;
    position: relative;
  }
  .mobile-teacher-desk::after {
    content: '';
    position: absolute;
    top: 6px; left: 10px;
    width: 20px; height: 14px;
    background: rgba(240,235,220,0.9);
    border-radius: 1px;
    transform: rotate(-4deg);
  }

  .mobile-seats { display: flex; flex-direction: column; gap: 22px; padding: 0 2px; }
  .mobile-desk-pair {
    position: relative;
    display: flex;
    gap: 6px;
    background: #8b6238;
    border: 2px solid #5e3f1e;
    border-radius: 3px;
    padding: 6px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.4);
  }
  .mobile-desk-pair .seat {
    width: 50%;
    height: 100px;
    flex: 1;
    font-size: 14px;
  }
  .mobile-desk-pair .seat::before {
    bottom: -11px;
    width: 60%;
    height: 9px;
  }
  .mobile-desk-pair .seat .plus { font-size: 30px; }
  .mobile-desk-pair .seat .free { font-size: 14px; }

  .modal { padding: 16px; }
  .modal h2 { font-size: 26px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Чарджоу, школа №20</h1>
    <p>Наш класс — найдите своё место</p>
    <div class="seats-counter" id="seatsCounter"></div>
  </header>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Найти одноклассника по имени..." autocomplete="off">
  </div>

  <div class="controls-row">
    <div class="periods">
      <button class="period-btn active" data-period="5">5 класс</button>
      <button class="period-btn" data-period="9">9 класс</button>
      <button class="period-btn" data-period="11">11 класс</button>
    </div>
    <button class="list-btn" id="listBtn">Список</button>
  </div>

  <div class="row-switcher" id="rowSwitcher">
    <button class="row-btn active" data-row="1">1 ряд</button>
    <button class="row-btn" data-row="2">2 ряд</button>
    <button class="row-btn" data-row="3">3 ряд</button>
  </div>

  <div class="classroom-wrap">
    <div class="classroom-scale" id="classroomScale">
      <div class="classroom" id="classroom">
        <div class="wall-top"></div>
        <div class="wall-left"></div>
        <div class="wall-right"></div>

        <div class="window-full"></div>

        <div class="blackboard">
          <div class="line1" id="boardDate"></div>
        </div>

        <div class="teacher-desk">Учительский<br>стол</div>

        <div class="seats-grid" id="seatsGrid"></div>

        <div class="flower-station" data-pot="0">
          <div class="stem"></div>
          <div class="leaf l1"></div>
          <div class="leaf l2"></div>
          <div class="chamomile">
            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="center"></div>
          </div>
          <div class="pot"></div>
        </div>

        <div class="flower-station" data-pot="1">
          <div class="stem"></div>
          <div class="leaf l1"></div>
          <div class="leaf l2"></div>
          <div class="chamomile">
            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="center"></div>
          </div>
          <div class="pot"></div>
        </div>

        <div class="flower-station" data-pot="2">
          <div class="stem"></div>
          <div class="leaf l1"></div>
          <div class="leaf l2"></div>
          <div class="chamomile">
            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="center"></div>
          </div>
          <div class="pot"></div>
        </div>

      </div>
    </div>

    <div class="mobile-classroom" id="mobileClassroom">
      <div class="mobile-blackboard"><div class="line1" id="mobileBoardDate"></div></div>
      <div class="mobile-teacher-desk">Учительский стол</div>
      <div class="mobile-seats" id="mobileSeats"></div>
    </div>
  </div>
</div>

<!-- Модалка занять место -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Занять место</h2>
    <p class="modal-sub" id="modalSub"></p>
    <label>Имя и фамилия *</label>
    <input type="text" id="inputName" placeholder="Например: Иван Петров" maxlength="60" autocomplete="name">
    <label>Пара слов о себе (необязательно)</label>
    <textarea id="inputComment" placeholder="Например: сидел с Петровым, вечно списывал" maxlength="200"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancel">Отмена</button>
      <button class="btn-save" id="btnSave">Сесть</button>
    </div>
    <div class="modal-error" id="modalError"></div>
  </div>
</div>

<!-- Модалка список -->
<div class="modal-overlay" id="listOverlay">
  <div class="modal list-modal">
    <h2 id="listTitle">Наш класс</h2>
    <p class="modal-sub" id="listSub"></p>
    <div class="list-content" id="listContent"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="listClose">Закрыть</button>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div class="tooltip" id="tooltip">
  <div class="tt-name" id="ttName"></div>
  <div class="tt-comment" id="ttComment"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzfzJa5q2a5Bab1x9LVC3iIosg6RyeKIVADQAvKn1XXTZ4OIVFkiBBOkg5hMdL0hRQf/exec';

const NAME_MAX_DESKTOP = 16;
const NAME_MIN_DESKTOP = 10;
const NAME_MAX_MOBILE = 18;
const NAME_MIN_MOBILE = 12;
const TOTAL_SEATS_PER_PERIOD = 30;

const DEFAULT_POTS = [
  { x: 38, y: 210 },
  { x: 38, y: 420 },
  { x: 38, y: 650 }
];

let currentPeriod = '5';
let currentRow = '1';
let allSeats = [];
let potsPositions = DEFAULT_POTS.slice();
let editingSeat = null;
let searchQuery = '';

const grid = document.getElementById('seatsGrid');
const mobileSeats = document.getElementById('mobileSeats');
const overlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalSub = document.getElementById('modalSub');
const inputName = document.getElementById('inputName');
const inputComment = document.getElementById('inputComment');
const btnSave = document.getElementById('btnSave');
const btnCancel = document.getElementById('btnCancel');
const modalError = document.getElementById('modalError');
const classroom = document.getElementById('classroom');
const classroomScale = document.getElementById('classroomScale');
const toast = document.getElementById('toast');
const seatsCounter = document.getElementById('seatsCounter');
const boardDate = document.getElementById('boardDate');
const mobileBoardDate = document.getElementById('mobileBoardDate');
const searchInput = document.getElementById('searchInput');

const listOverlay = document.getElementById('listOverlay');
const listContent = document.getElementById('listContent');
const listSub = document.getElementById('listSub');
const listTitle = document.getElementById('listTitle');
const listBtn = document.getElementById('listBtn');
const listClose = document.getElementById('listClose');

const tooltip = document.getElementById('tooltip');
const ttName = document.getElementById('ttName');
const ttComment = document.getElementById('ttComment');

const isMobile = () => window.matchMedia('(max-width: 700px)').matches;

// ====== ДАТА НА ДОСКЕ ======
function formatDate(d) {
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  return d.getDate() + ' ' + months[d.getMonth()] + ', ' + days[d.getDay()];
}
function setBoardDate() {
  const today = new Date();
  const day = today.getDate();
  const month = today.getMonth();
  let text;
  if (day === 3 && month === 8) {
    text = '3 сентября, среда';
  } else {
    text = formatDate(today);
  }
  boardDate.textContent = text;
  mobileBoardDate.textContent = text;
}

// ====== СЧЁТЧИК ======
function updateCounter() {
  const taken = currentSeats().length;
  seatsCounter.innerHTML = 'Занято <b>' + taken + '</b> из ' + TOTAL_SEATS_PER_PERIOD + ' мест';
}
function currentSeats() {
  return allSeats.filter(s => s.period === currentPeriod);
}
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function fitClassroom() {
  if (isMobile()) return;
  const availW = classroomScale.clientWidth - 8;
  if (availW < 1040) {
    const scale = availW / 1040;
    classroom.style.transform = 'scale(' + scale + ')';
    classroomScale.style.height = (classroom.offsetHeight * scale) + 'px';
  } else {
    classroom.style.transform = 'scale(1)';
    classroomScale.style.height = 'auto';
  }
}
window.addEventListener('resize', () => {
  fitClassroom();
  renderAll();
});

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    renderAll();
  });
});

document.querySelectorAll('.row-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.row-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRow = btn.dataset.row;
    renderMobile();
    const m = document.getElementById('mobileSeats');
    if (m) m.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});

// ====== ПОИСК ======
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim().toLowerCase();
  applySearchHighlight();
});
function applySearchHighlight() {
  const seats = document.querySelectorAll('.seat');
  seats.forEach(el => {
    el.classList.remove('dimmed', 'highlighted');
  });
  if (!searchQuery) return;

  let hasMatch = false;
  seats.forEach(el => {
    const nameEl = el.querySelector('.seat-name');
    if (!nameEl) { el.classList.add('dimmed'); return; }
    const text = (nameEl.textContent || '').toLowerCase();
    if (text.indexOf(searchQuery) >= 0) {
      el.classList.add('highlighted');
      hasMatch = true;
    } else {
      el.classList.add('dimmed');
    }
  });
}

// ====== GOOGLE ======
async function fetchAllSeats() {
  const res = await fetch(API_URL, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (data && data.error) throw new Error(data.error);
  return Array.isArray(data) ? data : [];
}
async function pushAllSeats(seats) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ seats: seats })
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (data.result !== 'ok') throw new Error(data.message || 'Ошибка сохранения');
}
function separateData(arr) {
  const seats = [];
  let pots = null;
  arr.forEach(item => {
    if (item && item.type === 'flowers' && Array.isArray(item.positions)) {
      pots = item.positions;
    } else {
      seats.push(item);
    }
  });
  return { seats, pots };
}
function buildPayload() {
  return allSeats.concat([{ type: 'flowers', positions: potsPositions }]);
}

// ====== СТАРТ ======
async function initialLoad() {
  renderAll();
  applyPotsPositions();
  try {
    const raw = await fetchAllSeats();
    const { seats, pots } = separateData(raw);
    allSeats = seats;
    if (pots && pots.length === 3) {
      potsPositions = pots.map((p, i) => ({
        x: typeof p.x === 'number' ? p.x : DEFAULT_POTS[i].x,
        y: typeof p.y === 'number' ? p.y : DEFAULT_POTS[i].y
      }));
    }
    renderAll();
    applyPotsPositions();
  } catch (err) {
    console.warn('Не удалось загрузить:', err.message);
    showToast('Не удалось загрузить данные. Обновите страницу.');
  }
}

// ====== СОХРАНЕНИЕ ======
async function saveSeatOptimistic(newSeat) {
  const prevAll = allSeats.map(s => ({ ...s }));
  const idx = allSeats.findIndex(s =>
    s.period === newSeat.period && s.row === newSeat.row && s.desk === newSeat.desk && s.side === newSeat.side
  );
  if (idx >= 0) allSeats[idx] = newSeat;
  else allSeats.push(newSeat);
  renderAll();
  try {
    await pushAllSeats(buildPayload());
  } catch (err) {
    allSeats = prevAll;
    renderAll();
    showToast('Не удалось сохранить: ' + err.message);
    throw err;
  }
}
async function deleteSeatOptimistic(seatData) {
  const prevAll = allSeats.map(s => ({ ...s }));
  allSeats = allSeats.filter(s => !(
    s.period === seatData.period && s.row === seatData.row && s.desk === seatData.desk && s.side === seatData.side
  ));
  renderAll();
  try {
    await pushAllSeats(buildPayload());
  } catch (err) {
    allSeats = prevAll;
    renderAll();
    showToast('Не удалось удалить: ' + err.message);
    throw err;
  }
}
async function savePotsPositions() {
  try {
    await pushAllSeats(buildPayload());
  } catch (err) {
    showToast('Не удалось сохранить цветы: ' + err.message);
  }
}

// ====== РЕНДЕР ======
function renderAll() {
  renderGrid();
  renderMobile();
  updateCounter();
  applySearchHighlight();
}
function renderGrid() {
  grid.innerHTML = '';
  const seats = currentSeats();
  for (let row = 1; row <= 3; row++) {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'seat-row';
    for (let desk = 1; desk <= 5; desk++) {
      const pairDiv = document.createElement('div');
      pairDiv.className = 'desk-pair';
      ['left', 'right'].forEach(side => pairDiv.appendChild(makeSeat(row, desk, side, seats)));
      rowDiv.appendChild(pairDiv);
    }
    grid.appendChild(rowDiv);
  }
  fitClassroom();
  requestAnimationFrame(fitAllNames);
}
function renderMobile() {
  mobileSeats.innerHTML = '';
  const seats = currentSeats();
  const row = parseInt(currentRow, 10);
  for (let desk = 1; desk <= 5; desk++) {
    const pairDiv = document.createElement('div');
    pairDiv.className = 'mobile-desk-pair';
    ['left', 'right'].forEach(side => pairDiv.appendChild(makeSeat(row, desk, side, seats)));
    mobileSeats.appendChild(pairDiv);
  }
  requestAnimationFrame(fitAllNames);
}
function makeSeat(row, desk, side, seats) {
  const seatData = seats.find(s => s.row === row && s.desk === desk && s.side === side);
  const div = document.createElement('div');
  div.className = 'seat' + (seatData ? ' taken' : '');
  if (seatData) {
    const nameEl = document.createElement('div');
    nameEl.className = 'seat-name';
    const words = (seatData.name || '').trim().split(/\s+/).filter(w => w);
    words.forEach(w => {
      const line = document.createElement('div');
      line.textContent = w;
      nameEl.appendChild(line);
    });
    div.appendChild(nameEl);

    // Tooltip (только для десктопа)
    if (!isMobile()) {
      div.addEventListener('mouseenter', (e) => showTooltip(e, seatData));
      div.addEventListener('mousemove', moveTooltip);
      div.addEventListener('mouseleave', hideTooltip);
    }
  } else {
    const plus = document.createElement('div');
    plus.className = 'plus';
    plus.textContent = '+';
    div.appendChild(plus);
    const free = document.createElement('div');
    free.className = 'free';
    free.textContent = 'свободно';
    div.appendChild(free);
  }
  div.addEventListener('click', () => openSeat(row, desk, side, seatData));
  return div;
}

// ====== TOOLTIP ======
function showTooltip(e, seatData) {
  ttName.textContent = seatData.name || '';
  if (seatData.comment) {
    ttComment.textContent = seatData.comment;
    ttComment.style.display = '';
  } else {
    ttComment.style.display = 'none';
  }
  tooltip.classList.add('show');
  moveTooltip(e);
}
function moveTooltip(e) {
  const pad = 14;
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  const rect = tooltip.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - 10) {
    x = e.clientX - rect.width - pad;
  }
  if (y + rect.height > window.innerHeight - 10) {
    y = e.clientY - rect.height - pad;
  }
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTooltip() {
  tooltip.classList.remove('show');
}

// ====== АВТОПОДГОНКА ШРИФТА ======
function measureTextWidth(text, fontSize, fontWeight) {
  const probe = document.createElement('span');
  probe.style.cssText = [
    'position: absolute', 'visibility: hidden', 'white-space: nowrap',
    'left: -9999px', 'top: 0',
    'font-family: "PT Serif", Georgia, serif',
    'font-weight: ' + (fontWeight || 'bold'),
    'font-size: ' + fontSize + 'px',
    'line-height: 1'
  ].join(';');
  probe.textContent = text;
  document.body.appendChild(probe);
  const w = probe.getBoundingClientRect().width;
  document.body.removeChild(probe);
  return w;
}
function fitName(el) {
  const lines = Array.from(el.children);
  if (lines.length === 0) return;
  const words = lines.map(l => (l.textContent || '').trim()).filter(w => w);
  if (words.length === 0) return;
  const longest = words.reduce((a, b) => a.length >= b.length ? a : b, '');
  const parent = el.parentElement;
  if (!parent) return;
  const cs = getComputedStyle(parent);
  const padL = parseFloat(cs.paddingLeft) || 0;
  const padR = parseFloat(cs.paddingRight) || 0;
  const availW = parent.clientWidth - padL - padR - 2;
  const maxSize = isMobile() ? NAME_MAX_MOBILE : NAME_MAX_DESKTOP;
  const minSize = isMobile() ? NAME_MIN_MOBILE : NAME_MIN_DESKTOP;
  if (measureTextWidth(longest, maxSize) <= availW) { el.style.fontSize = maxSize + 'px'; return; }
  for (let size = maxSize - 1; size >= minSize; size--) {
    if (measureTextWidth(longest, size) <= availW) { el.style.fontSize = size + 'px'; return; }
  }
  el.style.fontSize = minSize + 'px';
}
function fitAllNames() {
  document.querySelectorAll('.seat-name').forEach(el => fitName(el));
}

// ====== МОДАЛКА ЗАНЯТЬ ======
function openSeat(row, desk, side, seatData) {
  editingSeat = { row, desk, side, existing: seatData };
  modalError.textContent = '';
  inputName.value = seatData ? (seatData.name || '') : '';
  inputComment.value = seatData ? (seatData.comment || '') : '';
  const sideName = side === 'left' ? 'левое' : 'правое';
  modalSub.textContent = 'Ряд ' + row + ', парта ' + desk + ', ' + sideName + ' место · ' + currentPeriod + ' класс';
  if (seatData) {
    modalTitle.textContent = 'Место занято';
    if (seatData.comment) modalSub.textContent += ' · ' + seatData.comment;
    btnSave.textContent = 'Сохранить';
    showDeleteButton(seatData);
  } else {
    modalTitle.textContent = 'Занять место';
    btnSave.textContent = 'Сесть';
    hideDeleteButton();
  }
  btnSave.disabled = false;
  overlay.classList.add('show');
  setTimeout(() => inputName.focus(), 100);
}
function showDeleteButton(seatData) {
  hideDeleteButton();
  const btn = document.createElement('button');
  btn.className = 'btn-delete';
  btn.id = 'btnDelete';
  btn.textContent = 'Освободить это место';
  btn.addEventListener('click', () => onDeleteClick(seatData));
  document.querySelector('.modal-actions').prepend(btn);
}
function hideDeleteButton() {
  const b = document.getElementById('btnDelete');
  if (b) b.remove();
}
btnCancel.addEventListener('click', () => overlay.classList.remove('show'));
overlay.addEventListener('click', e => { if (e.target === overlay) btnCancel.click(); });

btnSave.addEventListener('click', () => {
  const name = inputName.value.trim();
  if (!name) { modalError.textContent = 'Пожалуйста, введите имя'; return; }
  const newSeat = {
    period: currentPeriod,
    row: editingSeat.row,
    desk: editingSeat.desk,
    side: editingSeat.side,
    name: name,
    comment: inputComment.value.trim() || null
  };
  overlay.classList.remove('show');
  saveSeatOptimistic(newSeat).catch(() => {});
});
function onDeleteClick(seatData) {
  if (!confirm('Освободить это место? Имя и комментарий будут удалены.')) return;
  overlay.classList.remove('show');
  deleteSeatOptimistic(seatData).catch(() => {});
}

// ====== МОДАЛКА СПИСОК ======
listBtn.addEventListener('click', openList);
listClose.addEventListener('click', () => listOverlay.classList.remove('show'));
listOverlay.addEventListener('click', e => { if (e.target === listOverlay) listOverlay.classList.remove('show'); });

function openList() {
  const seats = currentSeats();
  listTitle.textContent = currentPeriod + ' класс — кто сел';
  listSub.textContent = 'Всего мест занято: ' + seats.length + ' из ' + TOTAL_SEATS_PER_PERIOD;

  if (seats.length === 0) {
    listContent.innerHTML = '<div class="list-empty">Пока никто не сел. Будьте первым!</div>';
    listOverlay.classList.add('show');
    return;
  }

  // Сортировка по ряду, потом по парте, потом по стороне
  const sorted = seats.slice().sort((a, b) => {
    if (a.row !== b.row) return a.row - b.row;
    if (a.desk !== b.desk) return a.desk - b.desk;
    return a.side === 'left' ? -1 : 1;
  });

  listContent.innerHTML = '';
  sorted.forEach(s => {
    const item = document.createElement('div');
    item.className = 'list-item';

    const nameEl = document.createElement('div');
    nameEl.className = 'li-name';
    nameEl.textContent = s.name || '';
    item.appendChild(nameEl);

    const sideName = s.side === 'left' ? 'левое' : 'правое';
    const placeEl = document.createElement('div');
    placeEl.className = 'li-place';
    placeEl.textContent = 'Ряд ' + s.row + ', парта ' + s.desk + ', ' + sideName + ' место';
    item.appendChild(placeEl);

    if (s.comment) {
      const cEl = document.createElement('div');
      cEl.className = 'li-comment';
      cEl.textContent = '«' + s.comment + '»';
      item.appendChild(cEl);
    }

    // Клик — закрыть список и подсветить место
    item.addEventListener('click', () => {
      listOverlay.classList.remove('show');
      searchInput.value = s.name || '';
      searchQuery = (s.name || '').toLowerCase();
      applySearchHighlight();
      // Прокрутить к партам
      if (isMobile()) {
        // переключить на нужный ряд
        currentRow = String(s.row);
        document.querySelectorAll('.row-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.row === currentRow);
        });
        renderMobile();
        const m = document.getElementById('mobileSeats');
        if (m) m.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        const el = document.querySelector('.classroom-wrap');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });

    listContent.appendChild(item);
  });

  listOverlay.classList.add('show');
}

// ====== ПЕРЕТАСКИВАНИЕ ГОРШКОВ ======
function applyPotsPositions() {
  const pots = document.querySelectorAll('.flower-station');
  pots.forEach((el, i) => {
    const p = potsPositions[i] || DEFAULT_POTS[i];
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.style.bottom = 'auto';
  });
}
function initDrag() {
  const classroomEl = document.getElementById('classroom');
  const pots = document.querySelectorAll('.flower-station');

  let dragState = null;

  pots.forEach((el) => {
    el.addEventListener('pointerdown', onPointerDown);
  });

  function onPointerDown(e) {
    const el = e.currentTarget;
    const index = parseInt(el.dataset.pot, 10);
    const rect = classroomEl.getBoundingClientRect();
    const scale = classroomEl.offsetWidth > 0 ? rect.width / classroomEl.offsetWidth : 1;
    const localX = (e.clientX - rect.left) / scale;
    const localY = (e.clientY - rect.top) / scale;
    const px = potsPositions[index] && typeof potsPositions[index].x === 'number'
      ? potsPositions[index].x
      : (parseFloat(el.style.left) || 0);
    const py = potsPositions[index] && typeof potsPositions[index].y === 'number'
      ? potsPositions[index].y
      : (parseFloat(el.style.top) || 0);
    dragState = {
      el: el, index: index,
      offsetX: localX - px, offsetY: localY - py,
      pointerId: e.pointerId
    };
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  }
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerUp);

  function onPointerMove(e) {
    if (!dragState) return;
    if (e.pointerId !== dragState.pointerId) return;
    const rect = classroomEl.getBoundingClientRect();
    const scale = classroomEl.offsetWidth > 0 ? rect.width / classroomEl.offsetWidth : 1;
    let localX = (e.clientX - rect.left) / scale - dragState.offsetX;
    let localY = (e.clientY - rect.top) / scale - dragState.offsetY;
    const maxX = classroomEl.offsetWidth - 40;
    const maxY = classroomEl.offsetHeight - 40;
    localX = Math.max(0, Math.min(maxX, localX));
    localY = Math.max(0, Math.min(maxY, localY));
    potsPositions[dragState.index] = { x: localX, y: localY };
    dragState.el.style.left = localX + 'px';
    dragState.el.style.top = localY + 'px';
  }
  function onPointerUp(e) {
    if (!dragState) return;
    if (e.pointerId !== dragState.pointerId) return;
    const el = dragState.el;
    dragState = null;
    el.classList.remove('dragging');
    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
    savePotsPositions();
  }
}

// ====== СТАРТ ======
setBoardDate();
initDrag();
initialLoad();
</script>
