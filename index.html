<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Чарджоу, школа №20</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>Чарджоу, школа №20</h1>
    <p>Наш класс — найдите своё место</p>
    <div class="seats-counter" id="seatsCounter"></div>
  </header>

  <div class="birthday-banner" id="birthdayBanner"></div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Найти одноклассника по имени..." autocomplete="off">
  </div>

  <div class="controls-row">
    <div class="periods">
      <button class="period-btn active" data-period="5">5 класс</button>
      <button class="period-btn" data-period="9">9 класс</button>
      <button class="period-btn" data-period="11">11 класс</button>
    </div>
    <button class="list-btn" id="listBtn">Список</button>
  </div>

  <div class="row-switcher" id="rowSwitcher">
    <button class="row-btn active" data-row="1">1 ряд</button>
    <button class="row-btn" data-row="2">2 ряд</button>
    <button class="row-btn" data-row="3">3 ряд</button>
  </div>

  <div class="classroom-wrap" id="classroomWrap">
    <div class="classroom-scale" id="classroomScale">
      <div class="classroom" id="classroom">
        <div class="wall-top"></div>
        <div class="wall-left"></div>
        <div class="wall-right"></div>

        <div class="window-full"></div>

        <div class="blackboard">
          <div class="line1" id="boardDate"></div>
        </div>

        <div class="teacher-desk">Учительский<br>стол</div>

        <div class="seats-grid" id="seatsGrid"></div>
      </div>
    </div>

    <div class="mobile-classroom" id="mobileClassroom">
      <div class="mobile-blackboard"><div class="line1" id="mobileBoardDate"></div></div>
      <div class="mobile-teacher-desk">Учительский стол</div>
      <div class="mobile-seats" id="mobileSeats"></div>
    </div>

    <div class="flower-layer" id="flowerLayer">
      <div class="flower-station" data-pot="0">
        <div class="stem"></div>
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="chamomile">
          <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="center"></div>
        </div>
        <div class="pot"></div>
      </div>

      <div class="flower-station" data-pot="1">
        <div class="stem"></div>
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="chamomile">
          <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="center"></div>
        </div>
        <div class="pot"></div>
      </div>

      <div class="flower-station" data-pot="2">
        <div class="stem"></div>
        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="chamomile">
          <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="center"></div>
        </div>
        <div class="pot"></div>
      </div>

      <div id="birthdayLayer"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Занять место</h2>
    <p class="modal-sub" id="modalSub"></p>
    <label>Имя и фамилия *</label>
    <input type="text" id="inputName" placeholder="Например: Иван Петров" maxlength="60" autocomplete="name">

    <label>Дата рождения (необязательно)</label>
    <div class="bday-row">
      <select id="inputBdayDay"><option value="">День</option></select>
      <select id="inputBdayMonth"><option value="">Месяц</option></select>
    </div>
    <div class="bday-hint">Чтобы в ваш день рождения на парте появился цветок и фейерверк</div>

    <label>Пара слов о себе (необязательно)</label>
    <textarea id="inputComment" placeholder="Например: сидел с Петровым, вечно списывал" maxlength="200"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancel">Отмена</button>
      <button class="btn-save" id="btnSave">Сесть</button>
    </div>
    <div class="modal-error" id="modalError"></div>
  </div>
</div>

<div class="modal-overlay" id="listOverlay">
  <div class="modal list-modal">
    <h2 id="listTitle">Наш класс</h2>
    <p class="modal-sub" id="listSub"></p>
    <div class="list-content" id="listContent"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="listClose">Закрыть</button>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tt-name" id="ttName"></div>
  <div class="tt-comment" id="ttComment"></div>
  <div class="tt-bday" id="ttBday"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
